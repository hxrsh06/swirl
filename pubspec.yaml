name: shopping_swipe_app
description: SWIRL. - A modern shopping app with swipe functionality.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod: ^2.4.9
  
  # UI Components
  swipe_cards: ^2.0.0+1
  cached_network_image: ^3.3.0
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  confetti: ^0.7.0
  
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  firebase_auth: ^4.15.3
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  cloud_functions: ^4.5.6
  
  # ML & AI
  tflite_flutter: ^0.10.4
  
  # Payments
  # stripe_flutter: ^7.1.0 # Commented out due to version issues
  
  # Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # Utilities
  equatable: ^2.0.5
  get_it: ^7.6.4
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.2
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/models/
    - LOGO.png